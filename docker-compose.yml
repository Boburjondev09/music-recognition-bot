services:

  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: music-bot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_recognition}
      POSTGRES_USER: ${POSTGRES_USER:-music_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_password}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-music_user} -d ${POSTGRES_DB:-music_recognition}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================
  # MINIO
  # =========================
  minio:
    image: quay.io/minio/minio:latest
    container_name: music-bot-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


  # =========================
  # YT-DLP PO TOKEN PROVIDER
  # Generates the proof-of-origin token YouTube now
  # requires before it will serve actual audio/video
  # bytes (without it, downloads fail with HTTP 403).
  # =========================
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: music-bot-pot-provider
    restart: unless-stopped

    environment:
      # The token must be minted from the same IP that will actually
      # download the audio, otherwise YouTube rejects it with HTTP 403.
      HTTP_PROXY: ${YTDLP_PROXY:-}
      HTTPS_PROXY: ${YTDLP_PROXY:-}


  # =========================
  # MUSIC BOT APPLICATION
  # =========================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: music-recognition-bot
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_started

      pot-provider:
        condition: service_started

    environment:

      # =========================
      # SPRING
      # =========================
      SPRING_PROFILES_ACTIVE: prod


      # =========================
      # DATABASE
      # =========================
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-music_recognition}
      DB_USERNAME: ${POSTGRES_USER:-music_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-music_password}

      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}


      # =========================
      # TELEGRAM
      # =========================
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}

      TELEGRAM_BOT_API_BASE_URL: ${TELEGRAM_BOT_API_BASE_URL:-https://api.telegram.org}

      TELEGRAM_BOT_CONNECT_TIMEOUT: ${TELEGRAM_BOT_CONNECT_TIMEOUT:-10s}
      TELEGRAM_BOT_READ_TIMEOUT: ${TELEGRAM_BOT_READ_TIMEOUT:-30s}
      TELEGRAM_BOT_UPLOAD_TIMEOUT: ${TELEGRAM_BOT_UPLOAD_TIMEOUT:-300s}


      # =========================
      # ACRCLOUD
      # Audio recognition
      # =========================
      ACRCLOUD_HOST: ${ACRCLOUD_HOST:-identify-ap-southeast-1.acrcloud.com}
      ACRCLOUD_ACCESS_KEY: ${ACRCLOUD_ACCESS_KEY}
      ACRCLOUD_ACCESS_SECRET: ${ACRCLOUD_ACCESS_SECRET}

      ACRCLOUD_CONNECT_TIMEOUT: ${ACRCLOUD_CONNECT_TIMEOUT:-10s}
      ACRCLOUD_READ_TIMEOUT: ${ACRCLOUD_READ_TIMEOUT:-45s}


      # =========================
      # MINIO
      # =========================
      MINIO_ENABLED: ${MINIO_ENABLED:-true}

      MINIO_ENDPOINT: http://minio:9000

      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}

      MINIO_BUCKET: ${MINIO_BUCKET:-music-audio}

      MINIO_FAIL_ON_ERROR: ${MINIO_FAIL_ON_ERROR:-false}


      # =========================
      # YT-DLP
      # Optional outbound proxy for YouTube requests
      # =========================
      YTDLP_PROXY: ${YTDLP_PROXY:-}


      # =========================
      # SPOTIFY
      # Music search provider
      # =========================
      # =========================
      # ITUNES
      # Music search provider
      # =========================
      ITUNES_ENABLED: ${ITUNES_ENABLED:-true}
      ITUNES_COUNTRY: ${ITUNES_COUNTRY:-US}
      ITUNES_SEARCH_LIMIT: ${ITUNES_SEARCH_LIMIT:-100}
      ITUNES_CONNECT_TIMEOUT: ${ITUNES_CONNECT_TIMEOUT:-10s}
      ITUNES_READ_TIMEOUT: ${ITUNES_READ_TIMEOUT:-30s}


      # =========================
      # RECOGNITION
      # =========================
      MAX_RECOGNITION_FILE_SIZE: ${MAX_RECOGNITION_FILE_SIZE:-10485760}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-10}


      # =========================
      # PROCESSING
      # =========================
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      PROCESSING_QUEUE_CAPACITY: ${PROCESSING_QUEUE_CAPACITY:-100}


      # =========================
      # RATE LIMIT
      # =========================
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

      RATE_LIMIT_CLEANUP_INTERVAL_MILLIS: ${RATE_LIMIT_CLEANUP_INTERVAL_MILLIS:-60000}
      RATE_LIMIT_MAX_TRACKED_USERS: ${RATE_LIMIT_MAX_TRACKED_USERS:-10000}


      # =========================
      # CLEANUP
      # =========================
      CLEANUP_STUCK_MINUTES: ${CLEANUP_STUCK_MINUTES:-10}
      CLEANUP_INTERVAL_MILLIS: ${CLEANUP_INTERVAL_MILLIS:-300000}


      # =========================
      # MUSIC SEARCH
      # Spotify search + pagination
      # =========================
      MUSIC_SEARCH_ENABLED: ${MUSIC_SEARCH_ENABLED:-true}

      MUSIC_SEARCH_PAGE_SIZE: ${MUSIC_SEARCH_PAGE_SIZE:-10}
      MUSIC_SEARCH_MAX_RESULTS: ${MUSIC_SEARCH_MAX_RESULTS:-100}

      MUSIC_SEARCH_PRIMARY_RESULTS: ${MUSIC_SEARCH_PRIMARY_RESULTS:-40}
      MUSIC_SEARCH_RECOMMENDATION_RESULTS: ${MUSIC_SEARCH_RECOMMENDATION_RESULTS:-80}

      MUSIC_SEARCH_MIN_QUERY_LENGTH: ${MUSIC_SEARCH_MIN_QUERY_LENGTH:-2}
      MUSIC_SEARCH_MAX_QUERY_LENGTH: ${MUSIC_SEARCH_MAX_QUERY_LENGTH:-120}

      MUSIC_SEARCH_TIMEOUT: ${MUSIC_SEARCH_TIMEOUT:-60s}

      MUSIC_SEARCH_SESSION_TTL: ${MUSIC_SEARCH_SESSION_TTL:-15m}
      MUSIC_SEARCH_MAX_SESSIONS: ${MUSIC_SEARCH_MAX_SESSIONS:-1000}

      MUSIC_SEARCH_CLEANUP_INTERVAL_MILLIS: ${MUSIC_SEARCH_CLEANUP_INTERVAL_MILLIS:-60000}
      MUSIC_SEARCH_MAX_CONCURRENT_SEARCHES: ${MUSIC_SEARCH_MAX_CONCURRENT_SEARCHES:-2}

      MUSIC_SEARCH_CACHE_TTL: ${MUSIC_SEARCH_CACHE_TTL:-15m}
      MUSIC_SEARCH_MAX_CACHED_QUERIES: ${MUSIC_SEARCH_MAX_CACHED_QUERIES:-200}


      # =========================
      # ADMIN
      # =========================
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}

    ports:
      - "8080:8080"


# =========================
# VOLUMES
# =========================
volumes:
  postgres_data:
  minio_data: