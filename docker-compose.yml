services:
  postgres:
    image: postgres:16-alpine
    container_name: music-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_recognition}
      POSTGRES_USER: ${POSTGRES_USER:-music_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music_user} -d ${POSTGRES_DB:-music_recognition}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: music-bot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-recognition-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-music_recognition}
      DB_USERNAME: ${POSTGRES_USER:-music_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-music_password}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      ACRCLOUD_HOST: ${ACRCLOUD_HOST:-identify-eu-west-1.acrcloud.com}
      ACRCLOUD_ACCESS_KEY: ${ACRCLOUD_ACCESS_KEY}
      ACRCLOUD_ACCESS_SECRET: ${ACRCLOUD_ACCESS_SECRET}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-music-audio}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
